# 日次収集パイプライン（SPEC §11）
#
# ★ GitHub Actions の cron は混雑時に遅延・スキップされる仕様（SPEC §17.2-7）。
#   それ自体は防げないので、別建ての monitor.yml でデータの鮮度を監視する。
name: daily

on:
  schedule:
    # 21:00 UTC = 06:00 JST
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 依存パッケージの破壊的変更で勝手に壊れないよう lockfile 固定（SPEC §17.2-5）
      - run: npm ci

      - name: 収集とスナップショット保存
        env:
          GITHUB_TOKEN: ${{ secrets.WAKURU_GITHUB_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run collect

      # 機械判定。★ここで失敗してもジョブを止めないこと。
      #   止めると次の「データをコミット」が実行されず、その日のスナップショットが
      #   ランナーごと消える。この履歴だけは後から取り直せない（SPEC §6.2）。
      #   判定は外部APIを呼ばないので、翌日流し直せば復旧できる。
      - name: フラグ・スコアの判定
        continue-on-error: true
        run: npm run evaluate

      - name: データをコミット
        run: |
          git config user.name  "wakuru-bot"
          git config user.email "wakuru-bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore: daily snapshot $(TZ=Asia/Tokyo date +%F)"
          # 手動コミットとの衝突に備えてリベースしてから push
          git pull --rebase origin ${{ github.ref_name }}
          git push

      # ★ npm ci の失敗・タイムアウト・ランナー障害では collect.ts の中の通知が飛ばない。
      #   ワークフローが死んだこと自体をここで通知する（SPEC §17.2-2）
      - name: 失敗を通知
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-Type: application/json'             -d "{\"username\":\"Wakuru\",\"content\":\"⛔ daily ワークフローが失敗しました\n$RUN_URL\"}"             "$DISCORD_WEBHOOK_URL" || true
